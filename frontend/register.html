<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; object-src 'none'">
<link rel="stylesheet" href="css/style.css">
<title>Buat Akun | PSB SMK Coding</title>
</head>
<body>
<header class="nav" id="nav"></header>
<main class="wrap">
  <div class="card auth">
    <h2>Buat akun pendaftar</h2>
    <p class="muted">Akun digunakan untuk mengisi formulir, membayar, dan memantau status.</p>
    <form id="form" novalidate>
      <div class="field"><label for="nama">Nama lengkap</label><input id="nama" name="nama" type="text" autocomplete="name" required><small class="err" data-err="nama"></small></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><small class="err" data-err="email"></small></div>
      <div class="field"><label for="password">Kata sandi</label><input id="password" name="password" type="password" autocomplete="new-password" required><small class="err" data-err="password">Minimal 8 karakter, kombinasi huruf dan angka</small></div>
      <div class="field"><label for="password2">Ulangi kata sandi</label><input id="password2" name="password2" type="password" autocomplete="new-password" required><small class="err" data-err="password2"></small></div>
      <div class="actions"><button class="btn" type="submit">Buat akun</button></div>
    </form>
    <p class="small muted center">Sudah punya akun? <a href="login.html">Masuk</a></p>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
