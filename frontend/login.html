<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; object-src 'none'">
<link rel="stylesheet" href="css/style.css">
<title>Masuk | PSB SMK Coding</title>
</head>
<body>
<header class="nav" id="nav"></header>
<main class="wrap">
  <div class="card auth">
    <h2>Masuk</h2>
    <p class="muted">Gunakan akun yang Anda daftarkan.</p>
    <form id="form" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required><small class="err" data-err="email"></small></div>
      <div class="field"><label for="password">Kata sandi</label><input id="password" name="password" type="password" autocomplete="current-password" required><small class="err" data-err="password"></small></div>
      <div class="actions"><button class="btn" type="submit">Masuk</button></div>
    </form>
    <p class="small muted center">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
